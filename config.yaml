stream:
  name: us_markets
  enabled: true

# Fetch and persist optional cross-asset data for snapshots.
include_cross_assets: true

# Provider selection for each pipeline stage
# Options:
#   ingestion: "rss" (default) | "api_newsapi"
#   scoring: "heuristic_v2" (default) | "heuristic_v1"
#   enrichment: "fetch_extract" (default)
#   publisher: "telegram" (default) | "null"
providers:
  ingestion: rss
  scoring: heuristic_v2
  # ingestion: api_newsapi  # Uncomment to use TheNewsAPI instead of RSS

telegram:
  # Prefer env vars; allow optional override per stream
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  parse_mode_env: TELEGRAM_PARSE_MODE

schedule:
  daily_us_close_sgt: "06:00"
  weekend_wrap_sgt: "10:00"
  monday_preview_ny: "SUN 18:10"

monday_preview:
  conditional: true
  risk_threshold: 60
  force_publish: false
  force_skip: false

retention:
  news_items_days: 60
  fingerprints_days: 3650
  runs_days: 3650

dedupe:
  url_hash: true
  text_hash: true
  simhash:
    enabled: true
    hamming_threshold: 3
    window_days: 3
  title_trigram:
    enabled: true
    similarity_threshold: 0.85

enrichment:
  enabled: true
  max_enrich_per_run: 25
  allow_full_text_storage: false
  snippet_chars: 1200

rss:
  # Whitelisted RSS feeds are defined in files under ./rss so adding feeds is a file edit, not a code change.
  # Each line: URL (optionally "#" comments). Blank lines ignored.
  allowlist_files:
    - "rss/us_markets.txt"
  poll_interval_minutes: 20

# TheNewsAPI configuration (when providers.ingestion = "api_newsapi")
# API keys: Set NEWS_API_KEYS env var (comma-separated for rotation)
# Settings: See apis/newsapi_us_markets.txt for domains, lookback, etc.
# To list available sources: argus newsapi sources --categories business

constraints:
  max_words_daily: 420
  max_words_weekend: 520
  max_words_preview: 320
  max_takeaway_bullets: 5
  max_watch_bullets: 3

spotlight:
  enabled: false
  title: ""
  body: ""
  disclaimer: ""

log_level: INFO

# Daemon mode configuration (for VPS deployment with argus daemon start)
daemon:
  health_port: 8080
  health_bind: "127.0.0.1"  # Localhost only - access via SSH tunnel
  retention_hour: 3  # Daily retention cleanup at 03:00 UTC
  health_ping_minutes: 30  # Journald heartbeat interval (0 to disable)

  # Enable/disable individual jobs
  jobs_enabled:
    ingest: true
    us_close: true
    weekend_wrap: true
    monday_preview: true
    retention: true

  # Missed job policy: 'run_immediately' or 'skip'
  # - run_immediately: Run the job if it was missed during downtime
  # - skip: Wait for the next scheduled run
  missed_policy:
    ingest: run_immediately  # Always catch up on ingestion
    retention: run_immediately  # Always catch up on cleanup
    us_close: skip  # Don't send stale market updates
    weekend_wrap: skip  # Don't send stale weekend wraps
    monday_preview: skip  # Don't send stale monday previews
