streams:
  us_markets:
    name: us_markets
    enabled: true

    # Fetch and persist optional cross-asset data for snapshots.
    include_cross_assets: true

    # Provider selection for each pipeline stage
    # Options:
    #   ingestion: "rss" (default) | "api_newsapi"
    #   scoring: "heuristic_v2" (default) | "heuristic_v1"
    #   enrichment: "fetch_extract" (default)
    #   publisher: "telegram" (default) | "null"
    providers:
      ingestion: rss
      scoring: heuristic_v2
      # ingestion: api_newsapi  # Uncomment to use TheNewsAPI instead of RSS

    telegram:
      # Prefer env vars; allow optional override per stream
      bot_token_env: TELEGRAM_BOT_TOKEN
      chat_id_env: TELEGRAM_CHAT_ID
      parse_mode_env: TELEGRAM_PARSE_MODE

    schedule:
      daily_us_close_sgt: "06:00"
      weekend_wrap_sgt: "10:00"
      monday_preview_ny: "SUN 18:10"

    monday_preview:
      conditional: true
      risk_threshold: 60
      force_publish: false
      force_skip: false

    retention:
      news_items_days: 60
      fingerprints_days: 3650
      runs_days: 3650

    dedupe:
      url_hash: true
      text_hash: true
      simhash:
        enabled: true
        hamming_threshold: 3
        window_days: 3
      title_trigram:
        enabled: true
        similarity_threshold: 0.85

    enrichment:
      enabled: true
      max_enrich_per_run: 25
      allow_full_text_storage: false
      snippet_chars: 1200

    scoring:
      enabled: true
      window_hours: 24
      max_items_per_run: 100
      # Source tiering (optional): tier_1 (20pts), tier_2 (15pts), tier_3 (10pts), unlisted (5pts)
      source_tiers:
        tier_1:
          - "Reuters"
          - "Bloomberg"
          - "WSJ"
        tier_2:
          - "CNBC"
          - "Financial Times"
        tier_3:
          - "Yahoo Finance"
          - "MarketWatch"
      # LLM triage for news filtering (optional)
      # When enabled, uses an LLM to score and rank news items beyond heuristic scoring
      llm_triage_enabled: false
      llm_model: "mistralai/mistral-7b-instruct"  # Can use any OpenRouter model
      llm_max_items: 25

    rss:
      # Whitelisted RSS feeds are defined in files under ./rss so adding feeds is a file edit, not a code change.
      # Each line: URL (optionally "#" comments). Blank lines ignored.
      allowlist_files:
        - "rss/us_markets.txt"
      poll_interval_minutes: 20

    # TheNewsAPI configuration (when providers.ingestion = "api_newsapi")
    # API keys: Set NEWS_API_KEYS env var (comma-separated for rotation)
    # Settings: See apis/newsapi_us_markets.txt for domains, lookback, etc.
    # To list available sources: argus newsapi sources --categories business

    constraints:
      max_words_daily: 420
      max_words_weekend: 520
      max_words_preview: 320
      max_takeaway_bullets: 5
      max_watch_bullets: 3

    generator:
      enabled: true
      # OpenRouter model identifier (see https://openrouter.ai/models for options)
      # Common models:
      #   openai/gpt-4.1        - GPT-4.1 (latest GPT-4, good balance of quality/speed)
      #   openai/gpt-4o         - GPT-4 Omni (multimodal, fast)
      #   openai/o1-preview     - O1 Preview (reasoning model)
      #   anthropic/claude-3.5-sonnet  - Claude 3.5 Sonnet (high quality)
      #   anthropic/claude-3-sonnet     - Claude 3 Sonnet
      #   google/gemini-pro-1.5  - Gemini Pro 1.5
      #   mistralai/mistral-7b-instruct - Mistral 7B (faster, cheaper)
      model: openai/gpt-4.1
      # LLM temperature (0-1). Lower = more deterministic, higher = more creative
      temperature: 0.4
      # Number of retries on LLM failure
      max_retries: 1
      # HTTP timeout for LLM API calls (in seconds)
      timeout_seconds: 60

    spotlight:
      enabled: false
      title: ""
      body: ""
      disclaimer: ""

    # Per-stream daemon job overrides (takes precedence over global daemon.jobs_enabled)
    daemon:
      jobs_enabled:
        crypto_daily: false  # us_markets doesn't run crypto_daily

  crypto:
    name: crypto
    enabled: true

    # Fetch and persist optional cross-asset data for snapshots.
    include_cross_assets: false

    # Provider selection for each pipeline stage
    providers:
      ingestion: rss
      scoring: heuristic_v3
      enrichment: fetch_extract
      publisher: telegram

    telegram:
      # Prefer env vars; allow optional override per stream
      bot_token_env: TELEGRAM_BOT_TOKEN
      chat_id_env: TELEGRAM_CHAT_ID
      parse_mode_env: TELEGRAM_PARSE_MODE

    schedule:
      daily_crypto_utc: "00:00"

    retention:
      news_items_days: 60
      fingerprints_days: 3650
      runs_days: 3650

    dedupe:
      url_hash: true
      text_hash: true
      simhash:
        enabled: true
        hamming_threshold: 3
        window_days: 3
      title_trigram:
        enabled: true
        similarity_threshold: 0.85

    enrichment:
      enabled: true
      max_enrich_per_run: 25
      allow_full_text_storage: false
      snippet_chars: 1200

    scoring:
      enabled: true
      window_hours: 24
      max_items_per_run: 100
      # Source tiering (optional): tier_1 (20pts), tier_2 (15pts), tier_3 (10pts), unlisted (5pts)
      source_tiers:
        tier_1:
          - "CoinDesk"
          - "Cointelegraph"
          - "The Block"
        tier_2:
          - "Decrypt"
          - "Bitcoin.com"
          - "BeInCrypto"
        tier_3:
          - "CryptoSlate"
          - "AMBCrypto"
      # LLM triage for news filtering (optional)
      # When enabled, uses an LLM to score and rank news items beyond heuristic scoring
      llm_triage_enabled: false
      llm_model: "mistralai/mistral-7b-instruct"  # Can use any OpenRouter model
      llm_max_items: 25

    rss:
      # Whitelisted RSS feeds are defined in files under ./rss
      allowlist_files:
        - "rss/crypto.txt"
      poll_interval_minutes: 20

    constraints:
      max_words_daily: 450
      max_takeaway_bullets: 5
      max_watch_bullets: 3

    generator:
      enabled: true
      # OpenRouter model identifier (see https://openrouter.ai/models for options)
      # Common models:
      #   openai/gpt-4.1        - GPT-4.1 (latest GPT-4, good balance of quality/speed)
      #   openai/gpt-4o         - GPT-4 Omni (multimodal, fast)
      #   openai/o1-preview     - O1 Preview (reasoning model)
      #   anthropic/claude-3.5-sonnet  - Claude 3.5 Sonnet (high quality)
      #   anthropic/claude-3-sonnet     - Claude 3 Sonnet
      #   google/gemini-pro-1.5  - Gemini Pro 1.5
      #   mistralai/mistral-7b-instruct - Mistral 7B (faster, cheaper)
      model: openai/gpt-4.1
      # LLM temperature (0-1). Lower = more deterministic, higher = more creative
      temperature: 0.4
      # Number of retries on LLM failure
      max_retries: 5  # Increased from default 1 for crypto
      # HTTP timeout for LLM API calls (in seconds)
      timeout_seconds: 120  # Give LLM more time with larger prompts

    spotlight:
      enabled: false
      title: ""
      body: ""
      disclaimer: ""

    # Per-stream daemon job overrides (takes precedence over global daemon.jobs_enabled)
    daemon:
      jobs_enabled:
        us_close: false       # crypto doesn't run us_close
        weekend_wrap: false   # crypto doesn't run weekend_wrap
        monday_preview: false # crypto doesn't run monday_preview

    # Crypto-specific configuration
    crypto:
      top_n_market_cap: 10
      always_include_symbols:
        - "BTC"
        - "ETH"
      exclude_symbols:
        - "USDT"
        - "USDC"
        - "DAI"
      chartinspect_api_key_env: CHARTINSPECT_API

log_level: INFO

# Daemon mode configuration (for VPS deployment with argus daemon start)
daemon:
  health_port: 8080
  health_bind: "127.0.0.1"  # Localhost only - access via SSH tunnel
  retention_hour: 3  # Daily retention cleanup at 03:00 UTC
  health_ping_minutes: 30  # Journald heartbeat interval (0 to disable)

  # Enable/disable individual jobs
  jobs_enabled:
    ingest: true
    us_close: true
    weekend_wrap: true
    monday_preview: true
    crypto_daily: true
    retention: true

  # Missed job policy: 'run_immediately' or 'skip'
  # - run_immediately: Run the job if it was missed during downtime
  # - skip: Wait for the next scheduled run
  missed_policy:
    ingest: run_immediately  # Always catch up on ingestion
    retention: run_immediately  # Always catch up on cleanup
    us_close: skip  # Don't send stale market updates
    weekend_wrap: skip  # Don't send stale weekend wraps
    monday_preview: skip  # Don't send stale monday previews
