[project]
name = "argus"
version = "0.1.0"
description = "US Close Market Update Bot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Argus Team" }
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pydantic>=2.0",
    "yfinance>=0.2.40",
    "exchange_calendars>=4.5",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "feedparser>=6.0",
    "lxml>=5.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
